services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: assetsearch-elasticsearch

    environment:
      - discovery.type=single-node

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    container_name: assetsearch-kibana

    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch

volumes:
  elasticsearch_data: